<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script type='text/javascript' src='https://www.x3dom.org/download/x3dom.js'> </script>
    <!--<script src="x3dom-full.js"></script>
    <script src="https://www.x3dom.org/download/x3dom-full.js"></script>-->
    <style>
        body {
            font-family: Arial;     /*ustawienie czcionki*/
            text-align: center;     /*wyśrodkowanie tekstu*/
        }
        #controls {
            margin-top: 20px;       /* dodanie przestrzeni nad elementem #controls */
        }
        input[type="range"], input[type="color"] {
            width: 200px;           /* ustala szerokość dla elementów input typu range i color czyli suwak i paleta kolorow */
            margin: 10px 0;         /* dodanie marginesow wokół tych elementów z gory i z dolu*/
        }
    </style>
</head>
<body>
    <h1>Minecraft Avatar</h1>    <!-- nagłówek strony -->

    <x3d width="400px" height="200px">      <!-- kontener z okreslonymi wymiarami -->
        <scene>
            <background skyColor='0.784 0.957 0.969'></background>      <!-- ustawienie koloru tła -->

            <!-- Głowa -->
            <transform id="glowa" translation="0 5 -20">
                <shape>
                    <appearance>
                        <material id="materialGlowy" diffuseColor="0.8 0.6 0.4"></material>
                    </appearance>
                    <box size="3 3 3"></box>
                </shape>

                <!-- Oczy -->
                <transform id="leweOko" translation="-0.8 0.8 1.4">
                    <shape>
                        <appearance>
                            <material id="materialLewegoOka" diffuseColor="1 1 1"></material>
                        </appearance>
                        <box size="0.8 0.8 0.8"></box>
                    </shape>
                </transform>
                <transform id="praweOko" translation="0.8 0.8 1.4">
                    <shape>
                        <appearance>
                            <material id="materialPrawegoOka" diffuseColor="1 1 1"></material>
                        </appearance>
                        <box size="0.8 0.8 0.8"></box>
                    </shape>
                </transform>
            </transform>

            <!-- Ciało -->
            <transform id="cialo" translation="0 2 -20">
                <shape>
                    <appearance>
                        <material id="materialCiala" diffuseColor="0.2 0.2 0.8"></material>
                    </appearance>
                    <box size="3 5 3"></box>
                </shape>
            </transform>

            <!-- Ręce -->
            <transform id="lewaReka" translation="-2.2 2 -20">
                <shape>
                    <appearance>
                        <material id="materialLewejReki" diffuseColor="0.8 0.6 0.4"></material>
                    </appearance>
                    <box size="1 3 1"></box>
                </shape>
            </transform>
            <transform id="prawaReka" translation="2.2 2 -20">
                <shape>
                    <appearance>
                        <material id="materialPrawejReki" diffuseColor="0.8 0.6 0.4"></material>
                    </appearance>
                    <box size="1 3 1"></box>
                </shape>
            </transform>
        </scene>
    </x3d>

    <div id="controls">         <!-- kontener dla elementów sterujących -->
        <h3>Eye color selection:</h3>      <!-- Napis -->
        <input type="color" id="kolorOczu" value="#ffffff">     <!-- Element do zmiany koloru oczu -->

        <h3>Clothing color selection:</h3>       <!-- Napis -->
        <input type="color" id="kolorCiala" value="#3366cc">       <!-- Element do zmiany koloru ubrania -->

        <h3>Skin color selection:</h3>        <!-- Napis -->
        <input type="color" id="kolorGlowyRak" value="#cc9966">        <!-- Element do zmiany koloru głowy -->

        <h3>Change head size:</h3>     <!-- Napis -->
        <input type="range" id="rozmiarGlowy" min="0.5" max="3" step="0.1" value="0.8">     <!-- Suwak do zmiany rozmiaru głowy -->
<!-- element typu zakres - suwak; odwolanie co zmienia; min i max wartosc; zmiana co 0.1; domyslna wartosc -->    
    </div>

    <script>
        // Zmiana koloru oczu
        document.getElementById('kolorOczu').addEventListener('input', function (event) {   // Nasłuchuje zmiany na input typu color
            const color = event.target.value;   // Pobiera nowy kolor wybrany przez użytkownika
            // Zmiana koloru oczu (lewe i prawe)
            document.getElementById('materialLewegoOka').setAttribute('diffuseColor', color);   // Ustawia nowy kolor dla lewego oka
            document.getElementById('materialPrawegoOka').setAttribute('diffuseColor', color);  // Ustawia nowy kolor dla prawego oka
        });

        // Zmiana koloru ciała
        document.getElementById('kolorCiala').addEventListener('input', function (event) {
            const color = event.target.value;   // Pobiera nowy kolor wybrany przez użytkownika
            // Zmiana koloru ciała
            document.getElementById('materialCiala').setAttribute('diffuseColor', color);
        });

        // Zmiana koloru skóry
        document.getElementById('kolorGlowyRak').addEventListener('input', function (event) {
            const color = event.target.value;   // Pobiera nowy kolor wybrany przez użytkownika
            // Zmiana koloru skóry
            document.getElementById('materialGlowy').setAttribute('diffuseColor', color);
            document.getElementById('materialLewejReki').setAttribute('diffuseColor', color);
            document.getElementById('materialPrawejReki').setAttribute('diffuseColor', color);
        });

        // Zmiana rozmiaru głowy
        document.getElementById('rozmiarGlowy').addEventListener('input', function (event) {    // Nasłuchuje zmiany na suwaku
            const size = event.target.value;    // Pobiera nową wartość rozmiaru z suwaka
            // Zmiana rozmiaru głowy
            document.getElementById('glowa').setAttribute('scale', `${size} ${size} ${size}`);  // Ustawia nowy rozmiar dla głowy
        });

        // symulacja mrugania
        let eyeColor = "1 1 1";        // aktualny kolor oczu, początkowo biały

        // zmiana koloru oczu
        document.getElementById('kolorOczu').addEventListener('input', function (event) {
            eyeColor = hexToRgb(event.target.value);  // Konwertuje HEX na RGB w skali 0-1
            // Ustawia eyeColor na nowy kolor oczu, który został wybrany przez użytkownika z palety
            // Ustawia nowy kolor (eyeColor) dla materiału lewego i prawego oka
            document.getElementById('materialLewegoOka').setAttribute('diffuseColor', eyeColor);
            document.getElementById('materialPrawegoOka').setAttribute('diffuseColor', eyeColor);
        });

        // Funkcja konwertujaca kolor HEX "#ff0000" na format RGB "1 0 0"
        function hexToRgb(hex) {
//hex.substring(1, 3) - wycina z ciągu hex dwa znaki zaczynając od 1 pomijając # na początku
//parseInt(hex.substring(1, 3), 16) - parseInt konwertuje ten ciąg znaków (np. "00") na liczbę w systemie dziesiętnym
//16 oznacza, że liczba jest w systemie szesnastkowym (HEX)
//przekształca wartość z zakresu 0–255 do zakresu 0–1 , 0/255 = 0
            let r = parseInt(hex.substring(1, 3), 16) / 255;    
            let g = parseInt(hex.substring(3, 5), 16) / 255;
            let b = parseInt(hex.substring(5, 7), 16) / 255;
            return `${r} ${g} ${b}`;    //zwraca wynik w formacie RGB
        }

        function simulateBlinking() {
            //pobranie elemetnow lewego i prawego oka
            const leftEye = document.getElementById('leweOko');
            const rightEye = document.getElementById('praweOko');
            //pobranie elementow materialu dla lewego i prawego oka
            const leftEyeMaterial = leftEye.getElementsByTagName('appearance')[0].getElementsByTagName('material')[0];
            const rightEyeMaterial = rightEye.getElementsByTagName('appearance')[0].getElementsByTagName('material')[0];

            // Ustawia oczy na ciałowe
            leftEyeMaterial.setAttribute('diffuseColor', '0.8 0.6 0.4');
            rightEyeMaterial.setAttribute('diffuseColor', '0.8 0.6 0.4');

            // Przywraca kolor oczu ustawiony przez użytkownika po czasie
            setTimeout(() => {
                leftEyeMaterial.setAttribute('diffuseColor', eyeColor);
                rightEyeMaterial.setAttribute('diffuseColor', eyeColor);
            }, 500);  // czas mrugania, zmienia kolor na ciałowy raz na 100ms
        }

        setInterval(simulateBlinking, 1000); // Zmienia kolor oczu co 1 sekundę
    </script>
</body>
</html>
